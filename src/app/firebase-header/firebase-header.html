
<header class="firebase-header"
        [class.dark-mode]="darkMode">

  <!-- Firebase Logo -->
  <a class="brand" href="https://firebase.google.com/">

    <svg class="firebase-logo"
         viewBox="0 0 40 48"
         xmlns="http://www.w3.org/2000/svg">

      <path fill="#FFA000"
            d="M4.5 33.5L17.2 5.2
               C18.1 3.1 20.9 3 22 5.1
               L35.5 30.1
               C39.2 37 34.5 44.5 26.5 45
               L15 45
               C6.5 44.8 1 40.1 4.5 33.5Z"/>

      <path fill="#FF6D00"
            d="M17.2 5.2L20.2 24.8
               L9.1 41.7L4.5 33.5Z"/>

      <path fill="#F57C00"
            d="M20.2 24.8L35.5 30.1
               C39.2 37 34.5 44.5 26.5 45
               L15 45L9.1 41.7Z"/>

      <path fill="#FDD835"
            d="M20.2 24.8L25.5 35.1
               L9.1 41.7Z"/>

    </svg>

    <span>Firebase</span>
  </a>

  <!-- Desktop Navigation -->
  <nav class="navigation">

    <div class="nav-item"
         *ngFor="let item of navItems">

      <button
        class="nav-link"
        [class.active]="activeMenu === item.name"
        (click)="item.dropdown
          ? toggleDropdown(item.name)
          : selectMenu(item.name)">

        {{ item.name }}

        <svg *ngIf="item.dropdown"
             class="dropdown-arrow"
             viewBox="0 0 12 8">
          <path d="M1 1L6 6L11 1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"/>
        </svg>

      </button>

      <!-- Navigation Dropdown -->
      <div class="nav-dropdown"
           *ngIf="openDropdown === item.name">

        <a *ngFor="let option of dropdownItems[item.name]"
           href="javascript:void(0)"
           (click)="selectMenu(item.name)">

          {{ option }}

        </a>

      </div>

    </div>

  </nav>

  <!-- Right Navigation -->
  <div class="right-actions">

    <!-- Search -->
    <div class="search-container">

      <svg viewBox="0 0 24 24"
           class="search-icon">
        <circle cx="10.8" cy="10.8" r="6.5"/>
        <path d="M16 16L21 21"/>
      </svg>

      <input
        type="text"
        placeholder="Search"
        [(ngModel)]="searchText"
        (keyup.enter)="search()">

      <span class="search-shortcut">/</span>

    </div>

    <!-- Theme Toggle -->
    <button class="theme-button"
            title="Change theme"
            (click)="toggleTheme()">

      <svg *ngIf="!darkMode"
           viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 1V4M12 20V23
                 M4.2 4.2L6.3 6.3
                 M17.7 17.7L19.8 19.8
                 M1 12H4M20 12H23
                 M4.2 19.8L6.3 17.7
                 M17.7 6.3L19.8 4.2"/>
      </svg>

      <svg *ngIf="darkMode"
           viewBox="0 0 24 24">
        <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
                 A8.5 8.5 0 1 0 20.5 15.5Z"/>
      </svg>

    </button>

    <!-- Language -->
    <div class="language-section">

      <button class="language-button"
              (click)="toggleDropdown('language')">

        <svg viewBox="0 0 24 24"
             class="globe-icon">

          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12H22
                   M12 2C6 8 6 16 12 22
                   M12 2C18 8 18 16 12 22"/>

        </svg>

        <span>{{ selectedLanguage }}</span>

        <svg class="dropdown-arrow"
             viewBox="0 0 12 8">
          <path d="M1 1L6 6L11 1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"/>
        </svg>

      </button>

      <div class="language-dropdown"
           *ngIf="openDropdown === 'language'">

        <button *ngFor="let language of languages"
                (click)="selectLanguage(language)">

          {{ language }}

        </button>

      </div>

    </div>

    <!-- Blog -->
    <a class="blog-link"
       href="https://firebase.blog/">
      Blog
    </a>

    <!-- Console -->
    <a class="console-link"
       href="https://console.firebase.google.com/"
       target="_blank">
      Go to console
    </a>

    <!-- More -->
    <button class="more-button"
            title="More options"
            (click)="toggleDropdown('more')">

      <span>⋮</span>

    </button>

    <div class="more-dropdown"
         *ngIf="openDropdown === 'more'">

      <a href="https://firebase.google.com/support">
        Help & Support
      </a>

      <a href="https://firebase.google.com/terms">
        Terms
      </a>

    </div>

    <!-- Profile -->
    <button class="profile-button"
            title="Account">
      A
    </button>

  </div>

  <!-- Mobile Menu -->
  <button class="mobile-toggle"
          (click)="toggleMobileMenu()">

    <span *ngIf="!mobileMenuOpen">☰</span>
    <span *ngIf="mobileMenuOpen">✕</span>

  </button>

  <div class="mobile-navigation"
       *ngIf="mobileMenuOpen">

    <button *ngFor="let item of navItems"
            (click)="item.dropdown
              ? toggleDropdown(item.name)
              : selectMenu(item.name)">

      {{ item.name }}
      <span>⌄</span>

    </button>

    <div class="mobile-submenu"
         *ngIf="openDropdown && dropdownItems[openDropdown]">

      <a *ngFor="let option of dropdownItems[openDropdown]"
         (click)="selectMenu(openDropdown!)">

        {{ option }}

      </a>

    </div>

    <a href="https://firebase.blog/">Blog</a>

    <a href="https://console.firebase.google.com/">
      Go to console
    </a>

  </div>

</header>
